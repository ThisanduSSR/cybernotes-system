version: '3.8'

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: securenotesdb
      MYSQL_USER: cybernotes
      MYSQL_PASSWORD: cybernotes123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/securenotesdb
      SPRING_DATASOURCE_USERNAME: cybernotes
      SPRING_DATASOURCE_PASSWORD: cybernotes123
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend

volumes:
  mysql_data:
